# GitLab CI for Loom VSCode Extension
# Disable Auto DevOps for this project
include: []

stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "20"

default:
  image: node:${NODE_VERSION}-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Install dependencies
.install:
  before_script:
    - npm ci --prefer-offline

# ESLint check
lint:eslint:
  stage: lint
  extends: .install
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Prettier format check
lint:prettier:
  stage: lint
  extends: .install
  script:
    - npm run format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Type checking with TypeScript
lint:typecheck:
  stage: lint
  extends: .install
  script:
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit tests with Vitest
test:unit:
  stage: test
  extends: .install
  script:
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Compile TypeScript
build:compile:
  stage: build
  extends: .install
  script:
    - npm run compile
  artifacts:
    paths:
      - out/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Package extension as .vsix
package:vsix:
  stage: build
  extends: .install
  script:
    - npm run package
    - mv *.vsix loom-${CI_COMMIT_SHORT_SHA}.vsix
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Release on tags
release:publish:
  stage: deploy
  extends: .install
  needs:
    - package:vsix
  script:
    - |
      VERSION=$(node -p "require('./package.json').version")
      VSIX=$(ls -1 *.vsix | head -n1)
      mv "$VSIX" loom-${VERSION}.vsix
      echo "Packaged loom-${VERSION}.vsix"
  artifacts:
    paths:
      - "*.vsix"
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Manual publish to VS Code Marketplace (requires VSCE_PAT variable)
release:marketplace:
  stage: deploy
  extends: .install
  needs:
    - package:vsix
  script:
    - sh scripts/publish-marketplace.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
