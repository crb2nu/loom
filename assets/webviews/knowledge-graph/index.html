<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{CSP}}
  <title>Knowledge Graph</title>
  <style>
    :root {
      --loom-graph-type-file: var(--vscode-charts-blue, #4fc3f7);
      --loom-graph-type-function: var(--vscode-charts-green, #81c784);
      --loom-graph-type-class: var(--vscode-charts-yellow, #ffb74d);
      --loom-graph-type-module: var(--vscode-charts-purple, #ba68c8);
      --loom-graph-type-concept: var(--vscode-charts-red, #e57373);
      --loom-graph-type-decision: var(--vscode-charts-blue, #64b5f6);
      --loom-graph-type-entity: var(--vscode-charts-orange, #aed581);
      --loom-graph-type-default: var(--vscode-disabledForeground, #90a4ae);
      --loom-graph-link: var(--vscode-descriptionForeground, #555);
      --loom-graph-link-label: var(--vscode-descriptionForeground, #888);
      --loom-graph-node-stroke: var(--vscode-editor-background, #fff);
      --loom-graph-node-label: var(--vscode-editor-foreground, #ccc);
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family);
    }
    #graph-container {
      width: 100vw;
      height: 100vh;
    }
    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: var(--vscode-editorWidget-background);
      border: 1px solid var(--vscode-editorWidget-border);
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 1000;
      max-width: 300px;
    }
    .legend {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--vscode-editorWidget-background);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="graph-container"></div>
  <div class="legend" id="legend"></div>
  <div class="tooltip" id="tooltip" style="display: none;"></div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const vscode = acquireVsCodeApi();
    let simulation;

    function cssVar(name, fallback) {
      const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return value || fallback;
    }

    function getTypeColors() {
      return {
        file: cssVar("--loom-graph-type-file", "#4fc3f7"),
        function: cssVar("--loom-graph-type-function", "#81c784"),
        class: cssVar("--loom-graph-type-class", "#ffb74d"),
        module: cssVar("--loom-graph-type-module", "#ba68c8"),
        concept: cssVar("--loom-graph-type-concept", "#e57373"),
        decision: cssVar("--loom-graph-type-decision", "#64b5f6"),
        entity: cssVar("--loom-graph-type-entity", "#aed581"),
        default: cssVar("--loom-graph-type-default", "#90a4ae"),
      };
    }

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message.type === "updateGraph") {
        renderGraph(message.data);
      }
    });

    function renderGraph(data) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const typeColors = getTypeColors();
      const palette = {
        link: cssVar("--loom-graph-link", "#555"),
        linkLabel: cssVar("--loom-graph-link-label", "#888"),
        nodeStroke: cssVar("--loom-graph-node-stroke", "#fff"),
        nodeLabel: cssVar("--loom-graph-node-label", "#ccc"),
      };

      d3.select("#graph-container").selectAll("*").remove();

      const svg = d3
        .select("#graph-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .call(
          d3.zoom().on("zoom", (event) => {
            g.attr("transform", event.transform);
          })
        );

      const g = svg.append("g");

      const types = [...new Set(data.nodes.map((node) => node.type))];
      const legend = d3.select("#legend");
      legend.html("");
      types.forEach((type) => {
        const item = legend.append("div").attr("class", "legend-item");
        item
          .append("div")
          .attr("class", "legend-color")
          .style("background-color", typeColors[type] || typeColors.default);
        item.append("span").text(type);
      });

      simulation = d3
        .forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.edges).id((node) => node.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(30));

      const link = g
        .append("g")
        .selectAll("line")
        .data(data.edges)
        .enter()
        .append("line")
        .attr("stroke", palette.link)
        .attr("stroke-width", 1.5)
        .attr("stroke-opacity", 0.6);

      const linkLabels = g
        .append("g")
        .selectAll("text")
        .data(data.edges)
        .enter()
        .append("text")
        .text((edge) => edge.type)
        .attr("font-size", 10)
        .attr("fill", palette.linkLabel)
        .attr("text-anchor", "middle");

      const node = g
        .append("g")
        .selectAll("circle")
        .data(data.nodes)
        .enter()
        .append("circle")
        .attr("r", 12)
        .attr("fill", (item) => typeColors[item.type] || typeColors.default)
        .attr("stroke", palette.nodeStroke)
        .attr("stroke-width", 2)
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip)
        .on("click", (event, item) => {
          vscode.postMessage({ type: "nodeClicked", nodeId: item.id });
        })
        .call(
          d3
            .drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended)
        );

      const labels = g
        .append("g")
        .selectAll("text")
        .data(data.nodes)
        .enter()
        .append("text")
        .text((item) => item.label)
        .attr("font-size", 11)
        .attr("fill", palette.nodeLabel)
        .attr("dx", 15)
        .attr("dy", 4);

      simulation.on("tick", () => {
        link
          .attr("x1", (edge) => edge.source.x)
          .attr("y1", (edge) => edge.source.y)
          .attr("x2", (edge) => edge.target.x)
          .attr("y2", (edge) => edge.target.y);

        linkLabels
          .attr("x", (edge) => (edge.source.x + edge.target.x) / 2)
          .attr("y", (edge) => (edge.source.y + edge.target.y) / 2);

        node.attr("cx", (item) => item.x).attr("cy", (item) => item.y);

        labels.attr("x", (item) => item.x).attr("y", (item) => item.y);
      });
    }

    function showTooltip(event, item) {
      const tooltip = d3.select("#tooltip");
      let html = "<strong>" + item.label + "</strong><br>Type: " + item.type;
      if (item.properties) {
        Object.entries(item.properties).forEach(([key, value]) => {
          html += "<br>" + key + ": " + value;
        });
      }
      tooltip
        .style("display", "block")
        .style("left", event.pageX + 10 + "px")
        .style("top", event.pageY - 10 + "px")
        .html(html);
    }

    function hideTooltip() {
      d3.select("#tooltip").style("display", "none");
    }

    function dragstarted(event, item) {
      if (!event.active) {
        simulation.alphaTarget(0.3).restart();
      }
      item.fx = item.x;
      item.fy = item.y;
    }

    function dragged(event, item) {
      item.fx = event.x;
      item.fy = event.y;
    }

    function dragended(event, item) {
      if (!event.active) {
        simulation.alphaTarget(0);
      }
      item.fx = null;
      item.fy = null;
    }

    vscode.postMessage({ type: "ready" });
  </script>
</body>
</html>
